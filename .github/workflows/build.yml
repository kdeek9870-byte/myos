name: Build Custom Archiso Cloud Factory

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
    - name: Install System Dependencies
      run: |
        pacman -Syu --noconfirm
        pacman -S --noconfirm archiso git

    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Fix Legacy Profile Validation Check
      run: |
        # Strips out legacy memtest references causing validation abort errors
        rm -f profile/efiboot/loader/entries/*memtest*

    - name: Execute Cloud Build Factory
      run: |
        mkdir -p out work
        # Force low-memory ZSTD compression securely via environment variables
        export SQUASHFS_ARGS="-comp zstd -Xcompression-level 1"
        mkarchiso -v -w work/ -o out/ profile/

    - name: Upload Finished ISO File
      uses: actions/upload-artifact@v4
      with:
        name: myos-live-iso
        path: out/*.iso
